{% extends "base.html" %}
{% block main %}
<section><div class="container prose">
  {{ page.html }}
  {% if page.children %}
  <div class="tiles">
    {% for c in page.children %}
    <a class="tile" href="{{ c.url }}"><h3>{{ c.title }}</h3>{% if c.summary %}<p>{{ c.summary }}</p>{% endif %}</a>
    {% endfor %}
  </div>
  {% endif %}
</div></section>
{% endblock %}
